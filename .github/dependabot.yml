# Dependabot configuration reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This is an npm workspaces monorepo (root package.json "workspaces": app/shared,
# app/backend, app/frontend). GitHub's docs don't state that a single root
# `directory: "/"` entry auto-discovers/updates dependencies declared in nested
# workspace package.json files - their own monorepo guidance instead shows explicit
# per-directory entries (e.g. `directories: ["/frontend", "/admin-panel", ...]`) - so
# each workspace directory is listed here as its own package-ecosystem entry to
# guarantee coverage.
#
# Each entry groups all updates into at most two PRs per month (dev vs. production
# dependencies) via `groups.<name>.dependency-type`, instead of one PR per package.
#
# `typescript` is ignored past 6.1.0 in every npm entry below: typescript-eslint's peer
# range is `>=4.8.4 <6.1.0` and (checked 2026-09-23) no released typescript-eslint supports
# TypeScript 7 yet - see typescript-eslint/typescript-eslint#12518, closed not-planned pending
# TS 7.1's stable programmatic compiler API. A prior grouped dependency bump upgraded
# `typescript` to ^7.0.2 without checking this, which broke `npm install` (ERESOLVE) repo-wide
# until it was reverted to ^5.9.3. Remove this ignore once typescript-eslint raises its cap.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  - package-ecosystem: "npm"
    directory: "/app/shared"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  - package-ecosystem: "npm"
    directory: "/app/backend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
