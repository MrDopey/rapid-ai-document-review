name: OpenWiki Update

# Manual only (no schedule) - unlike upstream openwiki's example, which also
# runs on a daily cron. Dispatched by hand until the update quality/cost is
# proven out.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.5.2 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || 'qwen/qwen3.8-27b:free' }}

      # file, even though staging below is already scoped to doc paths only.
      # Safety net: never let the bot commit changes to its own workflow
      - name: Exclude workflow changes
        if: ${{ !cancelled() }}
        run: git checkout -- .github/workflows/openwiki-update.yml

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Commit and push OpenWiki update
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- openwiki AGENTS.md)" ]]; then
            echo "No OpenWiki changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openwiki AGENTS.md
          git commit -m "docs: update OpenWiki"
          git push origin HEAD:${{ github.ref_name }}

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
