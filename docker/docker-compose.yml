services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      HOST: "127.0.0.1"
      DATABASE_PATH: "/data/document-review.sqlite"
      PI_SESSION_STORAGE_PATH: "/data/pi-sessions"
      PI_CODING_AGENT_DIR: "/data/pi-agent"
      LOG_LEVEL: "info"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
